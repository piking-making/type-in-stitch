<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Type in Stitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Serif+KR:wght@200..900&family=Inter:wght@100..900&family=Baskervville:wght@400..700&family=Tiny5&family=Silkscreen:wght@400;700&family=Jacquarda+Bastarda+9&family=Cutive+Mono&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"DOSMyungjo";src:url("fonts/DOSMyungjo.woff2") format("woff2");font-display:swap}
@font-face{font-family:"DOSGothic";src:url("fonts/DOSGothic.woff2") format("woff2");font-display:swap}
@font-face{font-family:"NeoDunggeunmo";src:url("fonts/neodgm.woff2") format("woff2");font-display:swap}
:root{--bg:#f4f4f5;--panel:#fff;--fg:#1f1f23;--mute:#6b6b73;--line:#d9d9de;--accent:#1f1f23;--accent-fg:#fff;--stage:#f4f4f5;color-scheme:light;
--mono:"Cutive Mono","Courier New",monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18181a;--panel:#232326;--fg:#ececee;--mute:#9a9aa2;--line:#38383d;--accent:#ececee;--accent-fg:#18181a;--stage:#18181a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#18181a;--panel:#232326;--fg:#ececee;--mute:#9a9aa2;--line:#38383d;--accent:#ececee;--accent-fg:#18181a;--stage:#18181a;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 "Noto Sans KR",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:4px;padding:0 12px;height:28px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
button:hover{border-color:var(--fg)}
button.on,button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:disabled{opacity:.35;cursor:default}button:disabled:hover{border-color:var(--line)}
.ic{width:16px;height:16px;flex:none}
/* header */
header{flex:none;display:flex;align-items:flex-end;gap:32px;padding:18px 20px 14px}
.logo{font:400 40px/1 var(--mono);display:flex;align-items:flex-start;gap:12px;letter-spacing:.02em;user-select:none;white-space:nowrap}
.logo span{display:inline-block;padding-bottom:4px;border-bottom:2px solid currentColor}
.logo .in{border-bottom:0;border-top:2px solid currentColor;padding:2px 2px 0;margin-top:10px}
#steps{display:flex;gap:clamp(24px,6vw,96px);margin-left:auto}
#steps button{border:0;background:none;height:auto;padding:0 0 6px;border-radius:0;font:400 22px/1 var(--mono);color:var(--mute);border-bottom:2px solid transparent}
#steps button:hover{color:var(--fg)}
#steps button.on{color:var(--fg);border-bottom-color:var(--fg)}
#steps i{display:none}
.hbtns{display:none!important}
.lang{display:flex;gap:2px;font:400 14px/1 var(--mono)}
.lang button{border:0;background:none;height:auto;padding:2px 4px;color:var(--mute);border-radius:0}
.lang button.on{color:var(--fg);text-decoration:underline;text-underline-offset:4px;background:none}
/* workspace */
.app{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 20px}
.ws{flex:1;min-height:0;display:flex}
.pane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.ph{display:none}
.pc{flex:1;overflow:auto;display:flex}
canvas{display:block;margin:auto;max-width:none}
canvas.bleed{margin:0}
#craft{width:auto;height:28px;font-weight:700}
canvas.edit{cursor:crosshair;touch-action:none}canvas.txt{cursor:text}
.hid{position:fixed;left:0;top:0;width:200px;height:24px;opacity:0;pointer-events:none;z-index:-1;resize:none;border:0;padding:0}
/* toolbar */
.toolbar{flex:none;display:flex;align-items:center;gap:16px;padding:10px 0;min-height:48px}
.tl{flex:1;min-width:0;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body[data-step="1"] #info{display:none}
body:not([data-step="1"]) #optg{display:none}
.optg{display:flex}.optg button{padding:0 12px;font-weight:700;border-radius:0}.optg button:first-child{border-radius:4px 0 0 4px}.optg button:last-child{border-radius:0 4px 4px 0;border-left:1px solid var(--accent-fg)}
.tr{display:flex;align-items:center;gap:16px;flex:none}
.zoomw{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px}
input[type=range]{accent-color:var(--accent)}
#zoom{width:120px}
.seg{display:flex;border:1px solid var(--accent);border-radius:4px;overflow:hidden}
.seg button{border:0;border-radius:0;height:26px;padding:0 12px;font-weight:700;font-size:12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on+button,.seg button+button.on{border-left-color:var(--accent)}
.icb{display:flex;gap:4px}.icb button{width:28px;padding:0}
/* archive */
body.arch .app,body.arch .panels{display:none}
#arch{flex:1;min-height:0;overflow:auto;padding:8px 20px 40px}
.arhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-top:1px solid var(--fg);padding-top:12px;margin-bottom:12px;flex-wrap:wrap}
.arhead h2{margin:0;font:400 26px/1.2 var(--mono)}.arhead .hint{margin-top:4px}
.arctl{display:flex;gap:8px;align-items:center}#arRefresh{width:28px;padding:0}
#arGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{display:flex;flex-direction:column;gap:6px;min-width:0}
.card .thumb{height:170px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:4px;cursor:pointer;overflow:hidden}
.card h3{margin:4px 0 0;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{margin:0;font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbtns{display:flex;gap:6px}.cbtns button{flex:1}.cbtns .ghost{flex:0 0 auto;color:var(--mute)}
#arMore{margin:20px auto 0;display:flex}
dialog{border:1px solid var(--fg);border-radius:6px;padding:20px;width:min(480px,calc(100vw - 32px));background:var(--panel);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 12px;font:400 22px/1.2 var(--mono)}
#upPrev{height:180px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:4px;margin-bottom:12px;overflow:hidden}
dialog label{margin-top:10px}.dbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.dbtns button{min-width:80px}
/* panels */
.panels{flex:none;padding:4px 20px 16px;max-height:252px;overflow-y:auto}
.panels>section{display:grid;gap:0 32px}
#p1{grid-template-columns:1.5fr 1fr 1fr;grid-template-areas:"char para size" "char color gauge"}
#p2{grid-template-columns:2fr 1fr 1fr}
#p3{grid-template-columns:1fr}
.a-box{grid-area:box}.a-char{grid-area:char}.a-para{grid-area:para}.a-color{grid-area:color}.a-size{grid-area:size}.a-gauge{grid-area:gauge}
details.pn{border-top:1px solid var(--fg);min-width:0}
summary{list-style:none;padding:10px 0 8px;font-size:12px;font-weight:700;color:var(--fg);pointer-events:none}
summary::-webkit-details-marker{display:none}
.in{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;align-items:end;padding-bottom:12px}
.in>*{min-width:0}
.span{grid-column:1/-1}
label{display:block;font-size:11px;color:var(--mute);margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair{display:block}.pair input[type=range]{display:none}
textarea,select,input[type=number],input[type=text]{width:100%;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg);font:500 12px "Noto Sans KR",sans-serif}
select{padding-right:4px}
input:focus,select:focus{outline:none;border-color:var(--fg)}
input:disabled{opacity:.45}
input[type=color]{width:100%;height:28px;border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:3px;cursor:pointer}
.row{display:contents}
.hint{font-size:11px;color:var(--mute);line-height:1.5;margin:0}
.chk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg);margin:0;cursor:pointer}
.chk input{accent-color:var(--accent);width:14px;height:14px;margin:0}
/* step 1 columns */
.a-box .boxbtns{display:flex;gap:8px}.a-box #addbox{flex:1}.a-box #delbox{width:28px;padding:0}
.a-char .in{grid-template-columns:repeat(4,1fr)}
.f-font{grid-column:span 2}
.f-fname{grid-column:span 2}
.pair2{display:flex;gap:6px}.pair2 button{width:28px;padding:0;flex:none}
.links{grid-column:span 2;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;align-self:end;min-height:28px}
.linkb{border:0;background:none;height:auto;padding:0;color:var(--mute);font-size:11px;text-decoration:underline;text-underline-offset:3px;justify-content:flex-start}
.linkb .ic{width:13px;height:13px}
.linkb:hover{color:var(--fg)}
#fmsg{margin:0;font-size:11px}
.a-para .in>div:last-child{grid-column:1/-1}
.seg.full{width:100%}.seg.full button{flex:1;padding:0}
/* step 2 */
.a-tools .in{grid-template-columns:1.1fr 1fr}
.tgrid{display:flex;gap:6px}
.tgrid button{flex:1;flex-direction:column;height:56px;gap:4px;font-size:11px;padding:0 4px}
.tgrid .ic{width:18px;height:18px}
.pencolor{display:flex;gap:8px;align-items:center}.pencolor input[type=color]{flex:1}
.sw{width:28px;height:28px;padding:0;border-radius:4px;border:1px solid var(--line);flex:none}
.a-act .tgrid button{height:56px}
/* step 3 */
.a-exp .in{grid-template-columns:1fr 1fr 300px;align-items:start}
.a-exp .hint{grid-column:1/3}
#sum{grid-column:1/3;font-size:13px!important;color:var(--fg)!important}
.a-exp .chk{grid-column:1/3}
.exbtns{grid-column:3;grid-row:1/4;display:flex;flex-direction:column;gap:8px;align-self:center}#pdfbtn{height:44px;font-size:14px;font-weight:700}#upbtn{height:36px;font-weight:700}
@media (max-width:980px){#p1{grid-template-columns:1fr 1fr;grid-template-areas:"char char" "para size" "color gauge"}#p2{grid-template-columns:1fr 1fr}.a-tools{grid-column:1/-1}}
@media (max-width:820px){body{height:auto;overflow:auto}header{flex-wrap:wrap;gap:14px;padding:16px}.logo{font-size:30px}#steps{margin-left:0;width:100%;justify-content:space-between}#steps button{font-size:17px}.app{padding:0 16px}.ws{min-height:52vh}.toolbar{flex-wrap:wrap}.tr{flex:1 1 100%;flex-wrap:wrap;gap:10px}.panels{max-height:none;padding:4px 16px 24px}#p1,#p2{grid-template-columns:1fr;grid-template-areas:none}#p1>*{grid-area:auto}.a-exp .in{grid-template-columns:1fr}.a-exp .hint,#sum,.a-exp .chk,.exbtns{grid-column:1;grid-row:auto}}

</style>
</head>
<body data-step="1">
<header>
<div class="logo" aria-label="Type in Stitch"><span>Type</span><span class="in">in</span><span>Stitch</span></div>
<nav id="steps"><button id="st1" data-ti="s1"><i>1</i><span>1. Type</span></button><button id="st2" data-ti="s2"><i>2</i><span>2. Draw</span></button><button id="st3" data-ti="s3"><i>3</i><span>3. Export</span></button><button id="st4" data-ti="arch"><i>4</i><span>4. Archive</span></button></nav>
<span class="hbtns"><button id="hb"><span data-ic="left"></span><span data-i="back"></span></button><button id="hn" class="primary"><span id="hnl"></span><span id="hni"></span></button></span>
<span class="lang"><button id="lko">KO</button><button id="len">EN</button></span>
</header>
<main class="app">
<textarea id="txt" class="hid" wrap="off" spellcheck="false">글자를 실로 써 보세요
Type in Stitch</textarea>
<div class="ws" id="ws">
<section class="pane" id="paneL"><div class="ph"><span id="lblL"></span></div><div class="pc" id="pcL"><canvas id="cvL"></canvas></div></section>
<section class="pane" id="paneR"><div class="ph"><span id="lblR"></span></div><div class="pc" id="pcR"><canvas id="cvR"></canvas></div></section>
</div>
<div class="toolbar">
<div class="tl"><span id="hintL" data-i="hint"></span><span id="info"></span></div>
<div class="tr">
<div class="optg" id="optg"><button id="optMin" class="primary" data-ti="optMinT"><span data-ic="wand"></span><span data-i="optMin"></span></button><button id="optBest" class="primary" data-ti="optBestT"><span data-i="optBest"></span></button></div>
<span class="zoomw"><span data-i="zoom"></span><input type="range" id="zoom" min="2" max="40" step="0.5" value="16"></span>
<button id="fitb"><span data-ic="fit"></span><span data-i="fit"></span></button>
<div class="seg" id="modeR"><button data-v="text" id="vtext"><span data-ic="type"></span><span data-i="tx"></span></button><button data-v="chart" class="on"><span data-ic="grid"></span><span data-i="chart"></span></button><button data-v="sim"><span data-ic="yarn"></span><span data-i="sim"></span></button></div>
<select id="craft" data-ti="craftT"><option value="knit" data-i="cKnit"></option><option value="cross" data-i="cCross"></option><option value="filet" data-i="cFilet"></option></select>
<span class="icb" id="hbar"><button id="hundo" data-ti="hUndo"><span data-ic="undo"></span></button><button id="hredo" data-ti="hRedo"><span data-ic="redo"></span></button></span>
</div>
</div>
</main>
<section id="arch" hidden>
<div class="arhead"><div><h2 data-i="arch"></h2><p class="hint" data-i="arSub"></p></div>
<div class="arctl"><div class="seg" id="arFilter"><button data-c="" class="on" data-i="arAll"></button><button data-c="knit" data-i="cKnit"></button><button data-c="cross" data-i="cCross"></button><button data-c="filet" data-i="cFilet"></button></div><button id="arRefresh" data-ti="arRefresh"><span data-ic="reset"></span></button></div></div>
<p class="hint" id="arMsg"></p><div id="arGrid"></div><button id="arMore" hidden data-i="arMore"></button>
</section>
<dialog id="upDlg"><form id="upForm" method="dialog">
<h3 data-i="up"></h3><div id="upPrev"></div>
<label data-i="upTitleL" for="upTitle"></label><input type="text" id="upTitle" maxlength="60" autocomplete="off">
<label data-i="upNickL" for="upNick"></label><input type="text" id="upNick" maxlength="30" autocomplete="nickname">
<p class="hint" data-i="upNote"></p><p class="hint" id="upMsg"></p>
<div class="dbtns"><button type="button" id="upCancel" data-i="cancel"></button><button type="submit" id="upGo" class="primary" data-i="upGo"></button></div>
</form></dialog>
<div class="panels">
<section id="p1">
<details class="pn a-char" open><summary data-i="char"></summary><div class="in">
<div class="f-font"><label data-i="font"></label><select id="font"></select></div>
<div><label data-i="weight"></label><select id="weight"></select></div>
<div data-sl="fs"></div>
<div data-sl="sx"></div><div data-sl="tilt"></div><div data-sl="ls"></div><div></div>
<div class="f-fname"><label data-i="fph"></label><div class="pair2"><input type="text" id="fname"><button id="fadd"><span data-ic="plus"></span></button></div></div>
<div class="links"><p class="hint" id="fmsg"></p><button id="lfont" class="linkb"><span data-ic="type"></span><span data-i="lfont"></span></button></div>
<p class="hint" data-i="fhint" hidden></p>
</div></details>
<details class="pn a-para" open><summary data-i="para"></summary><div class="in">
<div data-sl="lh"></div>
<div><label data-i="align"></label><div class="seg full" id="al"><button data-v="left" class="on" data-i="l"></button><button data-v="center" data-i="c"></button><button data-v="right" data-i="r"></button><button data-v="justify" data-i="j"></button></div></div></div></details>
<details class="pn a-size" open><summary data-i="size"></summary><div class="in"><div data-sl="cols"></div><div data-sl="rows"></div><label class="chk span"><input type="checkbox" id="autosz" checked> <span data-i="autoSz"></span></label></div></details>
<details class="pn a-gauge" open><summary data-i="gauge"></summary><div class="in"><div data-sl="gst"></div><div data-sl="grw"></div></div></details>
<details class="pn a-color" open><summary data-i="color"></summary><div class="in">
<div><label data-i="cA"></label><input type="color" id="colA" value="#000000"></div>
<div><label data-i="cB"></label><input type="color" id="colB" value="#ffffff"></div></div></details>
</section>
<section id="p2" hidden>
<details class="pn a-tools" open><summary data-i="tools"></summary><div class="in">
<div class="tgrid" id="tools">
<button data-v="pen" class="on"><span data-ic="pen"></span><span data-i="pen"></span></button>
<button data-v="rect"><span data-ic="rect"></span><span data-i="rect"></span></button>
<button data-v="ellipse"><span data-ic="ellipse"></span><span data-i="ellipse"></span></button>
<button data-v="tri"><span data-ic="tri"></span><span data-i="tri"></span></button></div>
<div><label data-i="penColor"></label><div class="pencolor"><button id="sw1" class="sw" data-ti="cA"></button><button id="sw2" class="sw" data-ti="cB"></button><input type="color" id="penc" value="#000000"></div></div>
<div id="fillw" hidden><label data-i="shapeMode"></label><div class="seg full" id="fillm"><button data-v="fill" class="on" data-i="fillm"></button><button data-v="stroke" data-i="strokem"></button></div></div>
<div data-sl="bs"></div>
<p class="hint span" data-i="h2"></p></div></details>
<details class="pn a-act" open><summary data-i="act"></summary><div class="in"><div class="tgrid span">
<button id="undo"><span data-ic="undo"></span><span data-i="undo"></span></button>
<button id="clr"><span data-ic="trash"></span><span data-i="clr"></span></button></div></div></details>
<details class="pn" open><summary data-i="viewp"></summary><div class="in">
<label class="chk span"><input type="checkbox" id="ghost"> <span data-i="ghost"></span></label></div></details>
</section>
<section id="p3" hidden>
<details class="pn a-exp" open><summary data-i="s3"></summary><div class="in">
<p class="hint" data-i="h3"></p>
<p class="hint" id="sum"></p>
<label class="chk"><input type="checkbox" id="simpage" checked> <span data-i="simPage"></span></label>
<div class="exbtns"><button id="pdfbtn" class="primary"><span data-i="pdf"></span><span data-ic="dl"></span></button><button id="upbtn"><span data-ic="up"></span><span data-i="up"></span></button></div></div></details>
</section>
</div>
